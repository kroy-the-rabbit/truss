version: v2
plugins:
  - local: protoc-gen-go
    out: api/gen/go
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: api/gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/es:v1.6.1
    out: ../app/src/renderer/api/gen
    opt: target=ts
  - remote: buf.build/bufbuild/es:v1.10.0
    out: ../app/src/renderer/api/gen
    opt: target=ts
