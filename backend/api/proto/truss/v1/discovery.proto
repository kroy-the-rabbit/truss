syntax = "proto3";

package truss.v1;

option go_package = "github.com/kroy/truss/backend/api/gen/go/truss/v1;trussv1";

service DiscoveryService {
  rpc ListResourceKinds(ListResourceKindsRequest) returns (ListResourceKindsResponse);
}

message ResourceKind {
  string kind = 1;
  string group = 2;
  string version = 3;
  string resource = 4;  // plural name for API calls
  bool namespaced = 5;
}

message ResourceGroup {
  string category = 1;  // e.g., Workloads, Networking, Storage, Config, RBAC, Custom
  repeated ResourceKind kinds = 2;
}

message ListResourceKindsRequest {
  string context = 1;
}

message ListResourceKindsResponse {
  repeated ResourceGroup groups = 1;
}
