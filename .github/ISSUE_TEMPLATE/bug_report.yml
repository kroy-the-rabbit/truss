name: Bug report
description: Report a reproducible problem in Truss.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for us to reproduce quickly.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: Short description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include exact steps, context/namespace/resource details, and shortcuts used.
      placeholder: |
        1. Open Truss
        2. Select context ...
        3. Open ...
        4. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Truss version
      description: Check via F1 shortcut modal (top line shows app version).
      placeholder: v1.0.2
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Include Kubernetes version, distro (GKE/EKS/k3s/etc), and any network/VPN context.
      placeholder: Kubernetes 1.30, GKE, connected via VPN ...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste errors, stack traces, or attach screenshots.
      render: shell
    validations:
      required: false
